# Projeto isolado em rede propria. A porta e publicada so em loopback: o
# acesso externo passa pelo proxy HTTPS do host. Portas publicadas pelo Docker
# nao passam pelo firewall do host, por isso o bind em 127.0.0.1.

name: pixelboom

services:
  game:
    image: ghcr.io/davidcaetanor/pixelboom:${PIXELBOOM_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:2567:2567"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/Sao_Paulo
    user: node
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
