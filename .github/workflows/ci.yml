name: pixelboom CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar pnpm
        run: corepack enable

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build do shared
        run: pnpm --filter @pixelboom/shared build

      - name: Lint, typecheck e testes
        run: pnpm check

  imagem:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/davidcaetanor/pixelboom
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular a tag do commit
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a imagem
        env:
          IMAGEM_COMMIT: ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGEM_COMMIT")" = node
          docker run -d --name teste -p 2567:2567 "$IMAGEM_COMMIT"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:2567/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:2567/ | grep -q '<div id="game"'
          docker rm -f teste

      - name: Autenticar no GHCR
        if: ${{ env.PUBLICAR == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        if: ${{ env.PUBLICAR == 'true' }}
        run: docker push --all-tags "$IMAGEM"
